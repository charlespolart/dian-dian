org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9's built-in Kotlin and new DSL stay off, as in Flutter 3.47.5's own
# app template: Flutter plugins still use the old DSL, and purchases_ui_flutter
# applies the Kotlin Gradle Plugin itself (the build warns about it). Check
# both again at every Flutter upgrade.
android.builtInKotlin=false
android.newDsl=false
