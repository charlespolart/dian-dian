# ---------------------------------------------------------------------------
# pgBackRest — dian-dian production backup configuration.
#
# Stanza name: dian-dian
# Target repo: S3-compatible object storage (Cloudflare R2).
# Retention:   7 full backups, 30 differential backups.
#
# This file is a TEMPLATE: {{VARS}} are substituted at container start by
# pg-entrypoint.sh from env vars set in /srv/dian-dian/.env (see README.md):
#   PGBACKREST_S3_BUCKET            bucket name, e.g. "dian-dian-backups"
#   PGBACKREST_S3_ENDPOINT          e.g. "<account>.r2.cloudflarestorage.com"
#   PGBACKREST_S3_REGION            "auto" for R2
#   PGBACKREST_S3_KEY               access key id
#   PGBACKREST_S3_KEY_SECRET        secret access key
#   PGBACKREST_REPO_CIPHER_PASS     32+ byte random, encrypts the repo at rest
# ---------------------------------------------------------------------------

[global]
# Repo 1 — S3 remote (Cloudflare R2 is S3-compatible).
repo1-type=s3
repo1-s3-bucket={{PGBACKREST_S3_BUCKET}}
repo1-s3-endpoint={{PGBACKREST_S3_ENDPOINT}}
repo1-s3-region={{PGBACKREST_S3_REGION}}
repo1-s3-key={{PGBACKREST_S3_KEY}}
repo1-s3-key-secret={{PGBACKREST_S3_KEY_SECRET}}
repo1-s3-uri-style=path
repo1-path=/pgbackrest

# Encryption at rest. NEVER change cipher pass after first backup —
# it invalidates the entire repo.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass={{PGBACKREST_REPO_CIPHER_PASS}}

# Retention.
repo1-retention-full=7
repo1-retention-diff=30

# Compression + parallelism.
compress-type=zst
compress-level=6
process-max=2

# Logging.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Lock + spool pinned to a postgres-owned volume, NOT the /tmp and /var/spool
# defaults. `docker exec` runs as root, so any manual pgbackrest command would
# create /tmp/pgbackrest owned by root — and then archive_command, which runs
# as uid 70, dies with "Permission denied" and WAL archiving silently stops.
# Pinning here + `--user postgres` in ops/scripts/* removes the race entirely.
lock-path=/var/lib/pgbackrest/lock
spool-path=/var/lib/pgbackrest/spool

# Archive pushing (Postgres WAL) is asynchronous for throughput.
archive-async=y
archive-push-queue-max=1GiB

# Start-fast so full backups don't block WAL checkpointing.
start-fast=y

[dian-dian]
# LOCAL access on purpose — no `pg1-host`. pgBackRest needs direct filesystem
# access to PGDATA to copy data files, so every command runs INSIDE the
# postgres container (which ships the pgbackrest client, see
# postgres.Dockerfile) and reaches the DB over its Unix socket. The socket
# line in pg_hba is `trust`, so no DB password is needed here. Scheduling is a
# host cron that `docker compose exec`s in — keeps docker.sock out of every
# container (see ops/scripts/backup.sh).
pg1-port=5432
pg1-user=postgres
pg1-database=dian_dian
pg1-socket-path=/var/run/postgresql
pg1-path=/var/lib/postgresql/data/pgdata
