# Prod overlay — image from GHCR (no build), bind volumes under /srv,
# env_file injects every secret from /srv/dian-dian/.env, Caddy reverse proxy.
#
# Usage (from /srv/dian-dian/ on the VPS):
#   docker compose -f ops/docker-compose.yml -f ops/docker-compose.prod.yml up -d --wait
services:
  postgres:
    restart: always
    # Block privilege escalation (setuid/sudo) inside the container — free,
    # breaks nothing (playbook: security/vps-hardening.md).
    security_opt:
      - no-new-privileges:true
    environment:
      # Password auth in prod (dev keeps `trust` via the base file). Both vars
      # are read by the entrypoint at initdb time only, so they matter for a
      # FRESH cluster — e.g. restoring onto a new VPS, which must not come up
      # trust-authenticated. The live cluster's pg_hba was migrated in place.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    # No published ports in prod — only the backend on the docker network
    # reaches postgres, via the `postgres` hostname.
    volumes:
      - /srv/dian-dian/postgres:/var/lib/postgresql/data

  backend:
    image: ghcr.io/charlespolart/dian-dian-backend:${IMAGE_TAG:-latest}
    restart: always
    security_opt:
      - no-new-privileges:true
    # env_file injects every secret (RESEND_API_KEY, REVENUECAT_WEBHOOK_SECRET,
    # APPLE_BUNDLE_IDS, GOOGLE_CLIENT_IDS, etc.) without listing each one
    # under `environment:`. Add a var to `.env` and a redeploy picks it up.
    env_file:
      - /srv/dian-dian/.env
    environment:
      NODE_ENV: production
      # Fail-closed validation: missing var aborts `compose up` instead of
      # letting the backend boot with an empty secret.
      JWT_SECRET: ${JWT_SECRET:?must be set}
      # Overrides the passwordless URL from the base file — prod postgres
      # requires scram auth. Keep the password free of `$` (compose would
      # need `$$`); it is generated as hex.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?must be set}@postgres:5432/${POSTGRES_DB:-dian_dian}

  caddy:
    image: caddy:2-alpine
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/dian-dian/caddy/data:/data
      - /srv/dian-dian/caddy/config:/config
