# journald retention on the production VPS, installed by deploy-prod.sh as
# /etc/systemd/journald.conf.d/dian-dian.conf (systemd-journald restarted
# when it changes).
#
# The system journal holds the server's logs, the containers' included
# (docker-compose.prod.yml sends them here): IP addresses of SSH attempts,
# fail2ban bans, refused sign-ins and session tokens. The privacy policy
# and docs/REGISTRE.md (fiche 10) promise 6 months at most, as the CNIL
# recommends for logs (6 months to 1 year). journald deletes a whole file
# once all its entries are older than MaxRetentionSec: one file per day
# keeps the worst case at 178 + 1 days (held by
# backend/src/lib/retentionConfig.test.ts).
[Journal]
MaxRetentionSec=178d
MaxFileSec=1day
